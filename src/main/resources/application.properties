# ---------------------------------------------------------------
# StockSim application configuration
# Loaded at runtime by com.stocksim.util.ConfigLoader
# ---------------------------------------------------------------

# --- Database ---
db.url=jdbc:mysql://localhost:3306/stocksim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
db.driver=com.mysql.cj.jdbc.Driver
db.user=root
db.password=root

# --- Dataset (read once by DataSeeder on first launch) ---
csv.path=/Users/deepakshirajkulshrestha/Downloads/archive (1)/stocks_df.csv

# --- Simulation ---
sim.starting.balance=100000.00
sim.stocks=TCS,INFY,RELIANCE,HDFCBANK,ITC,WIPRO,ICICIBANK,TATAMOTORS,SBIN,HINDUNILVR

# --- Risk thresholds (percent of portfolio) ---
risk.stock.threshold=40.0
risk.sector.threshold=60.0

# --- File output ---
export.dir=reports
serialization.file=simulation_state.ser
